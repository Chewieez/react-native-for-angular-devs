<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGradNative" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="angGradNative" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="rnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glowNative" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bgGradNative)" stroke="#312e81" stroke-width="1.5"/>
  <!-- Mobile Phone Body -->
  <rect x="14" y="10" width="36" height="44" rx="6" fill="url(#phoneGrad)" stroke="#475569" stroke-width="1.5"/>
  <line x1="28" y1="14" x2="36" y2="14" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="17" y="18" width="30" height="32" rx="3" fill="#020617"/>
  <!-- React Native Atom inside screen -->
  <g transform="translate(32, 34)">
    <circle cx="0" cy="0" r="3" fill="#38bdf8" filter="url(#glowNative)"/>
    <ellipse cx="0" cy="0" rx="11" ry="4.2" fill="none" stroke="url(#rnGrad)" stroke-width="1.8" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="11" ry="4.2" fill="none" stroke="url(#rnGrad)" stroke-width="1.8" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="11" ry="4.2" fill="none" stroke="url(#rnGrad)" stroke-width="1.8" transform="rotate(150)"/>
  </g>
  <!-- Angular Badge Top Corner -->
  <polygon points="41,8 48,15 48,22 41,20" fill="url(#angGradNative)"/>
  <polygon points="43,12 46,15 46,18 43,17" fill="#ffffff" opacity="0.9"/>
</svg>